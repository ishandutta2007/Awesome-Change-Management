<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="80%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <radialGradient id="meshGlowEmerald" cx="18%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="meshGlowIndigo" cx="82%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="meshGlowCenter" cx="50%" cy="50%" r="42%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear Gradients for UI Cards & Borders -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.65"/>
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.90"/>
    </linearGradient>

    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e0f2fe"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0"/>
      <stop offset="25%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="75%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.8" stroke-opacity="0.28"/>
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.35"/>
    </pattern>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <style>
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1deg); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(12px) rotate(-1.2deg); }
      }
      @keyframes floatSlow3 {
        0%, 100% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(-8px) translateX(6px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.04); }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -40; }
      }
      @keyframes beaconPulse {
        0%, 100% { r: 5; opacity: 1; }
        50% { r: 9; opacity: 0.4; }
      }

      .floating-pill-1 {
        animation: floatSlow1 7s ease-in-out infinite;
      }
      .floating-pill-2 {
        animation: floatSlow2 8.5s ease-in-out infinite;
      }
      .floating-pill-3 {
        animation: floatSlow3 9s ease-in-out infinite;
      }
      .pulsing-mesh {
        transform-origin: center;
        animation: pulseGlow 6s ease-in-out infinite;
      }
      .stream-path {
        stroke-dasharray: 6 6;
        animation: dashFlow 2.5s linear infinite;
      }
      .beacon {
        animation: beaconPulse 2s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGradient)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>

  <!-- Ambient Pulsing Glow Orbs -->
  <ellipse class="pulsing-mesh" cx="240" cy="140" rx="360" ry="240" fill="url(#meshGlowEmerald)"/>
  <ellipse class="pulsing-mesh" cx="960" cy="280" rx="380" ry="260" fill="url(#meshGlowIndigo)"/>
  <ellipse class="pulsing-mesh" cx="600" cy="210" rx="420" ry="220" fill="url(#meshGlowCenter)"/>

  <!-- Dynamic Animated Tech Background Connections -->
  <g opacity="0.45">
    <path class="stream-path" d="M 100 80 Q 300 40 500 95 T 900 75 T 1140 115" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <path class="stream-path" d="M 80 340 Q 340 375 600 325 T 980 345 T 1150 295" fill="none" stroke="#34d399" stroke-width="2"/>
  </g>

  <!-- Animated Floating Dynamic Pills (Background Accents - Positioned safely around the edges) -->
  <!-- Top Left Pill -->
  <g class="floating-pill-1" transform="translate(65, 46)">
    <rect width="225" height="38" rx="19" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.2" filter="url(#softShadow)"/>
    <circle cx="22" cy="19" r="6" fill="#10b981"/>
    <text x="36" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" letter-spacing="0.3">ITIL 4 Change Enablement</text>
  </g>

  <!-- Top Right Pill -->
  <g class="floating-pill-2" transform="translate(915, 46)">
    <rect width="215" height="38" rx="19" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.2" filter="url(#softShadow)"/>
    <circle cx="22" cy="19" r="6" fill="#38bdf8"/>
    <text x="36" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" letter-spacing="0.3">CAB Approval Automation</text>
  </g>

  <!-- Bottom Left Pill -->
  <g class="floating-pill-3" transform="translate(75, 332)">
    <rect width="200" height="38" rx="19" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.2" filter="url(#softShadow)"/>
    <circle cx="22" cy="19" r="6" fill="#818cf8"/>
    <text x="36" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" letter-spacing="0.3">CMDB Impact Analysis</text>
  </g>

  <!-- Bottom Right Pill -->
  <g class="floating-pill-1" transform="translate(915, 332)">
    <rect width="215" height="38" rx="19" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.2" filter="url(#softShadow)"/>
    <circle cx="22" cy="19" r="6" fill="#34d399"/>
    <text x="36" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" letter-spacing="0.3">Zero-Downtime Releases</text>
  </g>

  <!-- Dynamic Request Flow Card in Background Center-Bottom -->
  <g opacity="0.40" transform="translate(355, 330)">
    <rect width="490" height="40" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="245" y="25" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11.5" letter-spacing="0.8">
      RFC [✓] ➔ RISK SCORING ➔ CAB APPROVAL ➔ AUTOMATION ➔ VERIFIED
    </text>
  </g>

  <!-- FOREGROUND CONTENT: Header, Badge, Titles, Subtitles (Guaranteed High Contrast & Never Obscured) -->
  <g filter="url(#softShadow)">
    <!-- Category Pill Badge -->
    <g transform="translate(480, 96)">
      <rect width="240" height="32" rx="16" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.5"/>
      <circle class="beacon" cx="18" cy="16" r="5" fill="#38bdf8"/>
      <text x="120" y="21" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.5">
        ITIL 4 &amp; ITSM ECOSYSTEM
      </text>
    </g>

    <!-- Main Title -->
    <text x="600" y="196" text-anchor="middle" fill="url(#titleGradient)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif" font-size="50" font-weight="900" letter-spacing="-1">
      Awesome Change Management
    </text>

    <!-- Accent Divider Line -->
    <line x1="340" y1="220" x2="860" y2="220" stroke="url(#accentLine)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Subtitle -->
    <text x="600" y="258" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19.5" font-weight="500" letter-spacing="0.2">
      ITIL Change Enablement, Release Governance &amp; Risk Assurance Platforms
    </text>

    <!-- Secondary Meta / Tagline -->
    <text x="600" y="294" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" letter-spacing="0.5">
      Enterprise SaaS Giants • Sovereign Open-Source Stacks • CAB Automation • CMDB Impact
    </text>
  </g>
</svg>